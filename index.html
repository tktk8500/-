<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 호가창 세력 & 수급 분석기 - multagicalc.com</title>
  <style>
    :root {
      --primary: #2563eb;
      --sell-color: #2563eb;
      --buy-color: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 16px;
      box-sizing: border-box;
    }
    .container {
      background: var(--card-bg);
      padding: 30px 22px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 480px;
    }
    .header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 20px; font-weight: 800; margin: 0 0 6px 0; }
    .subtitle { font-size: 12.5px; color: #64748b; margin: 0; }
    .form-group { margin-bottom: 14px; }
    label { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; font-weight: 700; margin-bottom: 5px; color: #334155; }
    .guide-tip { font-size: 11px; color: #64748b; font-weight: normal; }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    input:focus { border-color: var(--primary); }
    .row { display: flex; gap: 10px; }
    .row .form-group { flex: 1; }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-submit:hover { background-color: #1d4ed8; }
    .result-box {
      margin-top: 20px;
      padding: 18px;
      background-color: #f1f5f9;
      border-radius: 12px;
      display: none;
    }
    .result-title { font-size: 15px; font-weight: 800; text-align: center; margin-bottom: 12px; }
    .result-status { font-size: 16px; font-weight: 800; text-align: center; padding: 10px; border-radius: 8px; margin-bottom: 12px; }
    .status-bull { background-color: #fee2e2; color: #dc2626; }
    .status-bear { background-color: #dbeafe; color: #2563eb; }
    .status-neutral { background-color: #e2e8f0; color: #475569; }
    .info-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: #475569; }
    .info-row span.val { font-weight: 700; color: #0f172a; }
    .comment-box { background: #ffffff; padding: 12px; border-radius: 8px; font-size: 12.5px; line-height: 1.5; color: #334155; margin-top: 10px; border-left: 3px solid var(--primary); }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🔍 호가창 세력 & 매도벽 분석기</h1>
    <p class="subtitle">HTS 호가창 데이터를 기반으로 한 세력 수급 진단</p>
  </div>

  <div class="form-group">
    <label for="stockName">종목명</label>
    <input type="text" id="stockName" placeholder="예: 한국전력, 삼성전자">
  </div>

  <div class="row">
    <div class="form-group">
      <label for="currentPrice">현재가 (원)</label>
      <input type="text" inputmode="numeric" id="currentPrice" placeholder="예: 32250">
    </div>
    <div class="form-group">
      <label for="strength">체결강도 (%) <span class="guide-tip">우측 상단 %</span></label>
      <input type="text" inputmode="decimal" id="strength" placeholder="예: 130.05 또는 130">
    </div>
  </div>

  <div class="row">
    <div class="form-group">
      <label for="totalSellQty" style="color: var(--sell-color);">총 매도 잔량 <span class="guide-tip">호가창 맨밑 좌측</span></label>
      <input type="text" inputmode="numeric" id="totalSellQty" placeholder="예: 75215">
    </div>
    <div class="form-group">
      <label for="totalBuyQty" style="color: var(--buy-color);">총 매수 잔량 <span class="guide-tip">호가창 맨밑 우측</span></label>
      <input type="text" inputmode="numeric" id="totalBuyQty" placeholder="예: 12102">
    </div>
  </div>

  <div class="row">
    <div class="form-group">
      <label for="resistPrice">매도잔량 최대 가격 <span class="guide-tip">(선택)</span></label>
      <input type="text" inputmode="numeric" id="resistPrice" placeholder="파란색 잔량 최대 호가 (예: 32750)">
    </div>
    <div class="form-group">
      <label for="supportPrice">매수잔량 최대 가격 <span class="guide-tip">(선택)</span></label>
      <input type="text" inputmode="numeric" id="supportPrice" placeholder="붉은색 잔량 최대 호가 (예: 32000)">
    </div>
  </div>

  <button class="btn-submit" onclick="analyze()">호가창 수급 진단하기</button>

  <div class="result-box" id="resultBox">
    <div class="result-title" id="resTitle">진단 결과</div>
    <div class="result-status" id="resStatus">수급 상태</div>
    <div class="info-row"><span>매도 / 매수 잔량 비율</span><span class="val" id="resRatio">0%</span></div>
    <div class="info-row"><span>단기 돌파 가격 (매도벽)</span><span class="val" id="resResist">-</span></div>
    <div class="info-row"><span>단기 지지 가격 (매수벽)</span><span class="val" id="resSupport">-</span></div>
    <div class="comment-box" id="resComment"></div>
  </div>
</div>

<script>
  function cleanNum(val) {
    if (!val) return 0;
    return parseFloat(val.toString().replace(/,/g, '').trim()) || 0;
  }

  function analyze() {
    const stockName = document.getElementById('stockName').value.trim() || '보유 종목';
    const currentPrice = cleanNum(document.getElementById('currentPrice').value);
    const strength = cleanNum(document.getElementById('strength').value);
    const totalSell = cleanNum(document.getElementById('totalSellQty').value);
    const totalBuy = cleanNum(document.getElementById('totalBuyQty').value);
    const resistPrice = cleanNum(document.getElementById('resistPrice').value);
    const supportPrice = cleanNum(document.getElementById('supportPrice').value);

    if (!currentPrice || !strength || !totalSell || !totalBuy) {
      alert('현재가, 체결강도, 총 잔량을 모두 입력해 주세요.');
      return;
    }

    const ratio = Math.round((totalSell / totalBuy) * 100);
    const resBox = document.getElementById('resultBox');
    const resStatus = document.getElementById('resStatus');

    document.getElementById('resTitle').innerText = `📈 ${stockName} 호가 수급 정밀 진단`;
    document.getElementById('resRatio').innerText = `매도 잔량이 매수의 ${(ratio / 100).toFixed(1)}배 (${ratio}%)`;
    document.getElementById('resResist').innerText = resistPrice ? `${resistPrice.toLocaleString()} 원` : '미입력 (자동 생략)';
    document.getElementById('resSupport').innerText = supportPrice ? `${supportPrice.toLocaleString()} 원` : '미입력 (자동 생략)';

    resStatus.className = 'result-status';

    if (totalSell > totalBuy * 1.5 && strength >= 100) {
      resStatus.classList.add('status-bull');
      resStatus.innerText = '🔥 강력 상승형 (세력 주가 견인)';
      document.getElementById('resComment').innerHTML = `<strong>세력의 전형적인 상승 매집 호가창입니다.</strong><br>
      위쪽 매도 잔량(총 ${totalSell.toLocaleString()}주)이 매수 잔량 대비 <strong>${(ratio / 100).toFixed(1)}배</strong> 많음에도 체결강도(${strength}%)가 100%를 넘습니다. 위쪽 저항 물량을 시장가로 흡수하며 끌어올리는 강력한 상승 흐름입니다.`;
    } else if (totalBuy > totalSell * 1.5 && strength < 100) {
      resStatus.classList.add('status-bear');
      resStatus.innerText = '⚠️ 물량 떠넘기기 주의 (허매수 의심)';
      document.getElementById('resComment').innerHTML = `<strong>개인 유인용 받침벽일 가능성이 높습니다.</strong><br>
      아래쪽 매수 받침 잔량이 많으나 체결강도(${strength}%)가 100% 미만으로 부진합니다. 아래에 허매수를 대놓고 위에서 시장가로 매도 물량을 정리하는 패턴일 수 있습니다.`;
    } else {
      resStatus.classList.add('status-neutral');
      resStatus.innerText = '⚖️ 단기 방향성 공방 구간';
      document.getElementById('resComment').innerHTML = `<strong>매수와 매도 균형 구간입니다.</strong><br>
      현재가(${currentPrice.toLocaleString()}원)를 기준으로 거래량이 터지며 어느 쪽 벽을 뚫는지 확인이 필요합니다.`;
    }

    resBox.style.display = 'block';
  }
</script>
</body>
</html>
